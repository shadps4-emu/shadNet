# clientversions.cfg - which client versions may sign in to this shadNet server.
# One rule per line, checked top to bottom; the first match decides. No match: allowed.
#
#   allow|deny  empty|any|exact TEXT|prefix TEXT|regex PATTERN  [| message to the player]
#
# The version is what the emulator reports after signing in, for example
#   shadPS4 v0.19.1 WIP main-abc1234
# A client that reports nothing (older builds) counts as empty.
#
# Examples:
#   deny prefix shadPS4 v0.18 | shadPS4 0.18 is no longer supported. Please update.
#   deny regex ^shadPS4 v0\.1[0-7]\. | Please update shadPS4.

deny empty | Your shadPS4 build is too old for this shadNet server. Please update shadPS4.
allow any
